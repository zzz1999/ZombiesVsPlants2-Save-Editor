name: Rolling Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-windows-release
  cancel-in-progress: true

jobs:
  publish:
    name: Build and update latest release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\ZombiesVsPlants2SaveEditor.csproj -r win-x64

      - name: Build
        run: dotnet build .\ZombiesVsPlants2SaveEditor.csproj -c Release --no-restore

      - name: Run synthetic regression fixtures
        run: dotnet run --project .\ZombiesVsPlants2SaveEditor.csproj -c Release --no-build -- --fixture-test

      - name: Publish self-contained single-file executable
        run: >-
          dotnet publish .\ZombiesVsPlants2SaveEditor.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          -p:TrimMode=partial
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\publish

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $asset = '.\publish\ZombiesVsPlants2.SaveEditor.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  ZombiesVsPlants2.SaveEditor.exe" | Set-Content -Encoding ascii -NoNewline '.\publish\ZombiesVsPlants2.SaveEditor.exe.sha256'

      # A fixed tag and clobbered assets keep the Releases page as a one-build rolling window.
      - name: Move rolling tag to this commit
        shell: pwsh
        run: |
          git tag --force latest $env:GITHUB_SHA
          git push origin refs/tags/latest --force

      - name: Create or update rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $notes = "Automated win-x64 build from commit $shortSha. This release is replaced after every push to main."
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit latest --title 'Latest Windows Build' --notes $notes --latest
          } else {
            gh release create latest --title 'Latest Windows Build' --notes $notes --latest
          }
          gh release upload latest `
            '.\publish\ZombiesVsPlants2.SaveEditor.exe' `
            '.\publish\ZombiesVsPlants2.SaveEditor.exe.sha256' `
            --clobber
