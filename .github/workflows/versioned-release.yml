name: Versioned Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Keep every version bump in the queue and publish them one at a time.
concurrency:
  group: versioned-windows-release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Validate and publish a new version
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read and validate project version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          function Read-ProjectVersion([xml] $project, [string] $source) {
            $versions = @($project.Project.PropertyGroup.Version | Where-Object { $_ })
            if ($versions.Count -ne 1) {
              throw "Expected exactly one Version element in $source."
            }

            $value = ([string] $versions[0]).Trim()
            if ($value -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw "Version '$value' in $source must use the major.minor.patch format."
            }

            return $value
          }

          $projectPath = '.\ZombiesVsPlants2SaveEditor.csproj'
          [xml] $project = Get-Content -Raw -LiteralPath $projectPath
          $version = Read-ProjectVersion $project $projectPath
          $releaseRequested = $env:EVENT_NAME -eq 'workflow_dispatch'

          if ($env:EVENT_NAME -eq 'push') {
            $previousSha = $env:PREVIOUS_SHA
            if ([string]::IsNullOrWhiteSpace($previousSha) -or $previousSha -match '^0+$') {
              $releaseRequested = $true
            } else {
              $projectAtPreviousCommit = git show "${previousSha}:ZombiesVsPlants2SaveEditor.csproj"
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to read the project version from previous commit $previousSha."
              }

              [xml] $previousProject = $projectAtPreviousCommit -join "`n"
              $previousVersion = Read-ProjectVersion $previousProject "commit $previousSha"
              $comparison = ([version] $version).CompareTo([version] $previousVersion)
              if ($comparison -lt 0) {
                throw "Version rollback from $previousVersion to $version is not allowed."
              }

              $releaseRequested = $comparison -gt 0
              if ($releaseRequested) {
                Write-Host "Version increased from $previousVersion to $version."
              } else {
                Write-Host "Version remains $version; this push will validate without publishing a release."
              }
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release=$($releaseRequested.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\ZombiesVsPlants2SaveEditor.csproj -r win-x64

      - name: Build
        run: dotnet build .\ZombiesVsPlants2SaveEditor.csproj -c Release --no-restore

      - name: Run synthetic regression fixtures
        run: dotnet run --project .\ZombiesVsPlants2SaveEditor.csproj -c Release --no-build -- --fixture-test

      - name: Inspect version tag and release state
        id: release_state
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $tagRef = "refs/tags/$tag"
          $peeledRef = "$tagRef^{}"
          $remoteLines = @(git ls-remote --tags origin $tagRef $peeledRef)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to query remote tag $tag."
          }

          $tagLine = $remoteLines | Where-Object { $_.EndsWith("`t$tagRef", [StringComparison]::Ordinal) } | Select-Object -First 1
          $peeledLine = $remoteLines | Where-Object { $_.EndsWith("`t$peeledRef", [StringComparison]::Ordinal) } | Select-Object -First 1
          $commitLine = if ($peeledLine) { $peeledLine } else { $tagLine }
          $remoteCommit = if ($commitLine) { ($commitLine -split '\s+')[0] } else { $null }

          $releaseJson = gh release view $tag --json isDraft,assets,tagName 2>$null
          $releaseExitCode = $LASTEXITCODE
          $release = if ($releaseExitCode -eq 0) { $releaseJson | ConvertFrom-Json } else { $null }
          $action = $null

          if ($release) {
            if (-not $remoteCommit) {
              throw "Release $tag exists without a matching remote tag."
            }

            if ($release.isDraft) {
              if ($remoteCommit -ne $env:GITHUB_SHA) {
                throw "Draft release $tag targets $remoteCommit instead of $env:GITHUB_SHA."
              }

              $action = 'resume-draft'
            } else {
              $expectedAssets = @(
                'ZombiesVsPlants2.SaveEditor.exe',
                'ZombiesVsPlants2.SaveEditor.exe.sha256'
              )
              $assetNames = @($release.assets | ForEach-Object { [string] $_.name })
              $missingAssets = @($expectedAssets | Where-Object { $assetNames -notcontains $_ })
              if ($missingAssets.Count -ne 0) {
                throw "Published release $tag is incomplete and will not be modified. Missing: $($missingAssets -join ', ')."
              }

              if ($env:EVENT_NAME -eq 'push' -and $remoteCommit -ne $env:GITHUB_SHA) {
                throw "Published release $tag targets $remoteCommit instead of this version-bump commit $env:GITHUB_SHA."
              }

              $action = 'skip'
              Write-Host "Published release $tag already contains both expected assets; nothing will be changed."
            }
          } elseif ($remoteCommit) {
            if ($remoteCommit -ne $env:GITHUB_SHA) {
              throw "Tag $tag already targets $remoteCommit instead of $env:GITHUB_SHA."
            }

            $action = 'create-from-tag'
          } else {
            $action = 'create-new'
          }

          "action=$action" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish self-contained single-file executable
        if: steps.version.outputs.release == 'true' && steps.release_state.outputs.action != 'skip'
        run: >-
          dotnet publish .\ZombiesVsPlants2SaveEditor.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          -p:TrimMode=partial
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\publish

      - name: Validate published executable
        if: steps.version.outputs.release == 'true' && steps.release_state.outputs.action != 'skip'
        shell: pwsh
        run: |
          $executable = '.\publish\ZombiesVsPlants2.SaveEditor.exe'
          $expectedVersion = "Zombies vs Plants 2 Save Editor ${{ steps.version.outputs.version }}"
          $actualVersion = ((& $executable --version) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'The published executable failed its version check.'
          }
          if ($actualVersion -ne $expectedVersion) {
            throw "Published version '$actualVersion' did not match '$expectedVersion'."
          }

          & $executable --fixture-test
          if ($LASTEXITCODE -ne 0) {
            throw 'The published executable failed its regression fixtures.'
          }

      - name: Generate SHA-256 checksum
        if: steps.version.outputs.release == 'true' && steps.release_state.outputs.action != 'skip'
        shell: pwsh
        run: |
          $asset = '.\publish\ZombiesVsPlants2.SaveEditor.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  ZombiesVsPlants2.SaveEditor.exe" | Set-Content -Encoding ascii -NoNewline '.\publish\ZombiesVsPlants2.SaveEditor.exe.sha256'

      - name: Create or recover version release
        if: steps.version.outputs.release == 'true' && steps.release_state.outputs.action != 'skip'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $action = '${{ steps.release_state.outputs.action }}'
          $executable = '.\publish\ZombiesVsPlants2.SaveEditor.exe'
          $checksum = '.\publish\ZombiesVsPlants2.SaveEditor.exe.sha256'
          $title = "Zombies vs Plants 2 Save Editor $version"
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $notes = "Automated self-contained win-x64 build for version $version from commit $shortSha."

          if ($action -eq 'resume-draft') {
            # Draft assets may be replaced while recovering; published releases are never modified.
            gh release upload $tag $executable $checksum --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to recover the draft assets for $tag."
            }

            gh release edit $tag --title $title --notes $notes --draft=false
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to publish the recovered draft release $tag."
            }
          } else {
            $arguments = @(
              'release', 'create', $tag,
              $executable, $checksum,
              '--title', $title,
              '--notes', $notes
            )
            if ($action -eq 'create-from-tag') {
              $arguments += '--verify-tag'
            } elseif ($action -eq 'create-new') {
              $arguments += @('--target', $env:GITHUB_SHA)
            } else {
              throw "Unknown release action '$action'."
            }

            & gh @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create release $tag. A rerun can recover any draft left by GitHub CLI."
            }
          }
